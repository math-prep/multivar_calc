<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="title"><title id="title">Cylindrical coordinates separate horizontal radius r, angle theta and height z</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245b49"/></marker></defs><rect width="600" height="310" rx="14" fill="#f1f4ec"/><g stroke="#80917c" stroke-width="1.5" fill="none"><path d="M200 255H465M200 255L70 300M200 255V25" marker-end="url(#arrow)"/><ellipse cx="260" cy="220" rx="130" ry="40" class="fill"/><ellipse cx="260" cy="80" rx="130" ry="40" class="fill bold"/><path d="M130 80V220M390 80V220M200 255L335 220V80" class="bold"/><path d="M335 80L200 115V255" stroke-dasharray="4 5"/><path d="M245 255Q250 240 250 242" stroke="#b18b38" stroke-width="3"/><circle cx="335" cy="80" r="5" fill="#245b49"/><text x="472" y="262">x</text><text x="51" y="305">y</text><text x="183" y="20">z</text><text x="270" y="250" class="label">r</text><text x="343" y="155" class="label">z</text><text x="244" y="276" class="label">θ</text><text x="425" y="100" class="small">(r cos θ, r sin θ, z)</text><text x="425" y="133" class="small">dV = r dz dr dθ</text><text x="425" y="165" class="small">Roof and floor</text><text x="425" y="185" class="small">set the z bounds.</text></g><style>text{font:14px system-ui,sans-serif;fill:#233b34;stroke:none}.label{font:italic 19px Georgia,serif}.small{font-size:12px}.bold{stroke:#245b49;stroke-width:2.5}.fill{fill:#bfd3b1;fill-opacity:.65}</style></svg>