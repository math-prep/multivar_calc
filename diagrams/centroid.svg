<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="title"><title id="title">Variable-density plate below y equals x squared and center of mass at four fifths, one third</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245b49"/></marker></defs><rect width="600" height="310" rx="14" fill="#f1f4ec"/><g stroke="#80917c" stroke-width="1.5" fill="none"><path d="M65 260H370M90 280V30" marker-end="url(#arrow)"/><path d="M90 260Q200 260 310 60L310 260Z" fill="#c0d3b4"/><path d="M90 260Q200 260 310 60L310 260" class="bold"/><path d="M266 260V193.33" stroke-dasharray="4 4"/><circle cx="266" cy="193.33" r="6" fill="#245b49"/><text x="376" y="265">x</text><text x="74" y="25">y</text><text x="304" y="281">1</text><text x="172" y="94" class="label">y = x²</text><text x="270" y="175" class="small">(4/5, 1/3)</text><text x="404" y="103">density δ = x</text><text x="404" y="137" class="small">mass = 1/4</text><text x="404" y="163" class="small">x moment = 1/5</text><text x="404" y="205">x̄ = moment / mass</text><text x="404" y="232">x̄ = 4/5</text></g><style>text{font:14px system-ui,sans-serif;fill:#233b34;stroke:none}.label{font:italic 19px Georgia,serif}.small{font-size:12px}.bold{stroke:#245b49;stroke-width:2.5}.fill{fill:#bfd3b1;fill-opacity:.65}</style></svg>