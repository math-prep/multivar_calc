<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="title"><title id="title">Spherical radius rho and polar angle phi measured from the positive z axis</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245b49"/></marker></defs><rect width="600" height="310" rx="14" fill="#f1f4ec"/><g stroke="#80917c" stroke-width="1.5" fill="none"><path d="M210 245H455M210 245L80 295M210 245V25" marker-end="url(#arrow)"/><path d="M85 225C80 30 400 10 416 220" stroke-dasharray="5 5"/><ellipse cx="250" cy="228" rx="166" ry="42"/><path d="M210 245L355 85" class="bold" marker-end="url(#arrow)"/><path d="M355 85V215L210 245" stroke-dasharray="4 5"/><path d="M210 180Q232 179 253 196" stroke="#b18b38" stroke-width="3"/><path d="M262 245Q267 235 256 234" stroke="#8e73a1" stroke-width="3"/><circle cx="355" cy="85" r="5" fill="#245b49"/><text x="461" y="252">x</text><text x="60" y="303">y</text><text x="191" y="20">z</text><text x="270" y="146" class="label">ρ</text><text x="227" y="172" class="label">φ</text><text x="269" y="259" class="label">θ</text><text x="419" y="105" class="small">z = ρ cos φ</text><text x="419" y="132" class="small">r = ρ sin φ</text><text x="389" y="288" class="small">dV = ρ² sin φ dρ dφ dθ</text></g><style>text{font:14px system-ui,sans-serif;fill:#233b34;stroke:none}.label{font:italic 19px Georgia,serif}.small{font-size:12px}.bold{stroke:#245b49;stroke-width:2.5}.fill{fill:#bfd3b1;fill-opacity:.65}</style></svg>