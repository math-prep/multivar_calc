<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><title>Arc length — concept application</title><desc>A straight trajectory with the stated constant speed illustrates the actual two-second interval. Arc length accumulates speed over time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><path d="M136.25,296.25L136.25,153.75" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M65.00,225.00L635.00,225.00" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M136.25,225.00L563.75,225.00" stroke="#236750" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="136.25" cy="225.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="563.75" cy="225.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/></svg>