<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><title>26100e2-s2024:q6</title><desc>The actual first-octant plane cuts the axes at \(x=4\), \(y=6\), \(z=2\). These are the intercepts that determine the nested bounds. Setup: \(\int_0^6\int_0^{4-2y/3}\int_0^{2-x/2-y/3}1\,dz\,dx\,dy\)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><path d="M350.00,275.00L475.00,320.00" stroke="#236750" stroke-width="2" fill="none"/><path d="M350.00,275.00L222.50,350.00" stroke="#236750" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M350.00,275.00L350.00,205.00" stroke="#236750" stroke-width="2" fill="none"/><path d="M475.00,320.00L222.50,350.00" stroke="#236750" stroke-width="2" fill="none"/><path d="M475.00,320.00L350.00,205.00" stroke="#236750" stroke-width="2" fill="none"/><path d="M222.50,350.00L350.00,205.00" stroke="#236750" stroke-width="2" fill="none"/><circle cx="350.00" cy="275.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="475.00" cy="320.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="222.50" cy="350.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="350.00" cy="205.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/></svg>