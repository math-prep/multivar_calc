<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540"><title>field-domain worked example</title><desc>Only the open origin marker is excluded from the plane. The circle is a reference loop, not an outer boundary; any field arrows show tangential directions with normalized lengths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g transform="translate(0 80)"><path d="M350.00,385.00L350.00,65.00" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M190.00,225.00L510.00,225.00" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><circle cx="350.00" cy="225.00" r="5" fill="#fff" stroke="#b64636" stroke-width="2"/></g></svg>