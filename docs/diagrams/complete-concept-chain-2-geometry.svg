<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><title>Multivariable chain rule — concept 3</title><desc>Each arrow is an actual dependency path. Differentiate along every path from the independent variable to the output, multiplying along paths and adding their contributions. The application uses exactly \(z=x\) squared+\(y\), \(x=t\), and \(y=t\) squared.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><path d="M360.00,355.00L180.00,243.00" stroke="#4269a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M180.00,187.00L360.00,78.00" stroke="#b87418" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M360.00,355.00L540.00,243.00" stroke="#4269a4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M540.00,187.00L360.00,78.00" stroke="#b87418" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="278" y="21" width="164" height="48" rx="9" fill="#edf4ef" stroke="#adc4b7"/><rect x="98" y="191" width="164" height="48" rx="9" fill="#edf4ef" stroke="#adc4b7"/><rect x="458" y="191" width="164" height="48" rx="9" fill="#edf4ef" stroke="#adc4b7"/><rect x="278" y="366" width="164" height="48" rx="9" fill="#edf4ef" stroke="#adc4b7"/></svg>