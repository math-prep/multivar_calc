<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><title>26100e1-s2024:q6</title><desc>The green input projects onto the blue vector parallel to the actual target. The dashed residual is perpendicular to that target; a projection is a vector, not an unsigned length.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><path d="M350.00,275.00L335.00,276.67" stroke="#236750" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M350.00,275.00L370.00,322.50" stroke="#4269a4" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M335.00,276.67L370.00,322.50" stroke="#b87418" stroke-width="2" fill="none" stroke-dasharray="7 5"/></svg>