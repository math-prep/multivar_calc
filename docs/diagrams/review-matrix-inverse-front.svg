<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540"><title>matrix-inverse recall geometry</title><desc>The unit square is a scale reference. The gold outline illustrates one coordinate stretch; use the given matrix to undo both scales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g transform="translate(0 80)"><path d="M229.11,385.00L229.11,65.00" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M200.67,349.44L499.33,349.44" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M229.11,349.44L300.22,349.44L300.22,278.33L229.11,278.33Z" stroke="#236750" stroke-width="2.5" fill="#e4ede0"/><path d="M229.11,349.44L300.22,349.44L300.22,136.11L229.11,136.11L229.11,349.44" stroke="#b87418" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/></g></svg>