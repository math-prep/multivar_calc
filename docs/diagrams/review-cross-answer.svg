<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><title>cross worked example</title><desc>The two coordinate basis vectors fix the input order. The revealed gold vector illustrates the right-hand cross-product direction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g transform="translate(720 0) scale(-1 1)"><path d="M350.00,275.00L475.00,320.00" stroke="#236750" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M350.00,275.00L265.00,325.00" stroke="#4269a4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M350.00,275.00L350.00,135.00" stroke="#b87418" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g></svg>