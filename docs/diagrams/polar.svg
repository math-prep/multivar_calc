<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="title"><title id="title">Polar point, radial sector and area factor r dr d theta</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245b49"/></marker></defs><rect width="600" height="310" rx="14" fill="#f1f4ec"/><g stroke="#80917c" stroke-width="1.5" fill="none"><path d="M85 245H350M100 265V35" marker-end="url(#arrow)"/><path d="M100 245L280 245A180 180 0 0 0 234 125Z" class="fill"/><path d="M100 245L234 125" class="bold" marker-end="url(#arrow)"/><path d="M155 245A55 55 0 0 0 141 208" stroke="#b18b38" stroke-width="3"/><path d="M234 245V125H100" stroke-dasharray="4 4"/><circle cx="234" cy="125" r="5" fill="#245b49"/><text x="359" y="250">x</text><text x="85" y="28">y</text><text x="164" y="181" class="label">r</text><text x="160" y="227" class="label">θ</text><text x="245" y="120">(r cos θ, r sin θ)</text><text x="375" y="190">dA = r dr dθ</text><text x="375" y="217" class="small">Arc length grows with radius.</text><text x="111" y="291" class="small">Illustrative annular sector; question-specific bounds may differ.</text></g><style>text{font:14px system-ui,sans-serif;fill:#233b34;stroke:none}.label{font:italic 19px Georgia,serif}.small{font-size:12px}.bold{stroke:#245b49;stroke-width:2.5}.fill{fill:#bfd3b1;fill-opacity:.65}</style></svg>