<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="title"><title id="title">Two ways to slice the same triangular region x plus y less than or equal to one</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245b49"/></marker></defs><rect width="600" height="310" rx="14" fill="#f1f4ec"/><g stroke="#80917c" stroke-width="1.5" fill="none"><path d="M70 255H330M90 275V35" marker-end="url(#arrow)"/><path d="M90 255L90 65L280 255Z" class="fill bold"/><path d="M165 255V140" stroke="#d2a23c" stroke-width="9" opacity=".8"/><path d="M90 160H185" stroke="#647aab" stroke-width="7" opacity=".8"/><text x="338" y="260">x</text><text x="74" y="27">y</text><text x="274" y="279">1</text><text x="69" y="65">1</text><text x="143" y="93" class="label">x + y = 1</text><text x="370" y="105">Vertical slice</text><text x="370" y="129" class="small">0 ≤ y ≤ 1 − x</text><text x="370" y="185">Horizontal slice</text><text x="370" y="209" class="small">0 ≤ x ≤ 1 − y</text><text x="100" y="300" class="small">Same points. Different inner variable.</text></g><style>text{font:14px system-ui,sans-serif;fill:#233b34;stroke:none}.label{font:italic 19px Georgia,serif}.small{font-size:12px}.bold{stroke:#245b49;stroke-width:2.5}.fill{fill:#bfd3b1;fill-opacity:.65}</style></svg>