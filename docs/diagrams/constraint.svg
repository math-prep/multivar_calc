<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="title"><title id="title">A gradient normal and tangent at a point on a circular constraint</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245b49"/></marker></defs><rect width="600" height="310" rx="14" fill="#f1f4ec"/><g stroke="#80917c" stroke-width="1.5" fill="none"><path d="M65 240H425M225 280V30"/><circle cx="225" cy="155" r="95" class="bold"/><path d="M110 75L320 285M150 35L360 245" stroke="#cbb7d8"/><path d="M292 88L338 42" class="bold" marker-end="url(#arrow)"/><path d="M256 52L330 126" stroke="#b58b31" stroke-width="3"/><circle cx="292" cy="88" r="5" fill="#245b49"/><text x="437" y="245">x</text><text x="232" y="25">y</text><text x="99" y="286">Regular constraint g = c</text><text x="348" y="46">∇g</text><text x="345" y="120">tangent</text><text x="400" y="190" class="small">At an extremum,</text><text x="400" y="211" class="small">∇f is parallel to ∇g.</text><text x="400" y="235" class="small">The tangent is perpendicular.</text></g><style>text{font:14px system-ui,sans-serif;fill:#233b34;stroke:none}.label{font:italic 19px Georgia,serif}.small{font-size:12px}.bold{stroke:#245b49;stroke-width:2.5}.fill{fill:#bfd3b1;fill-opacity:.65}</style></svg>