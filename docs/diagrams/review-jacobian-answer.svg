<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540"><title>jacobian worked example</title><desc>The green unit square provides a scale reference. The gold outline is an intermediate stretch; the revealed blue outline illustrates the composed map or area scale, not an additional input domain.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g transform="translate(0 80)"><path d="M229.11,385.00L229.11,65.00" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M200.67,349.44L499.33,349.44" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M229.11,349.44L300.22,349.44L300.22,278.33L229.11,278.33Z" stroke="#236750" stroke-width="2.5" fill="#e4ede0"/><path d="M229.11,349.44L371.33,349.44L371.33,136.11L229.11,136.11L229.11,349.44" stroke="#4269a4" stroke-width="3" fill="none"/></g></svg>