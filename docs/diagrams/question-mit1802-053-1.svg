<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><title>MIT 53</title><desc>The actual tetrahedron has intercepts \(\left(1,0,0\right)\), \(\left(0,1,0\right)\), and \(\left(0,0,1\right)\), with nonnegative coordinates. Its height is the \(z\) coordinate. Setup: \(\bar z=(\iiint_D z\,dV)/(\iiint_D1\,dV)=(1/24)/(1/6)\)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><path d="M350.00,275.00L537.50,342.50" stroke="#236750" stroke-width="2" fill="none"/><path d="M350.00,275.00L222.50,350.00" stroke="#236750" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M350.00,275.00L350.00,65.00" stroke="#236750" stroke-width="2" fill="none"/><path d="M537.50,342.50L222.50,350.00" stroke="#236750" stroke-width="2" fill="none"/><path d="M537.50,342.50L350.00,65.00" stroke="#236750" stroke-width="2" fill="none"/><path d="M222.50,350.00L350.00,65.00" stroke="#236750" stroke-width="2" fill="none"/><circle cx="350.00" cy="275.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="537.50" cy="342.50" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="222.50" cy="350.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="350.00" cy="65.00" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/></svg>