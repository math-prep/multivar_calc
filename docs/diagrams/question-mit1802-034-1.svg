<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><title>MIT 34</title><desc>The polar bounds describe \(1\le x\le 2\), between \(y=0\) and \(y=x\). The radial bounds sec  \(\theta\)  and 2 sec  \(\theta\)  are vertical lines, not circles. Setup: \(\int_0^{\pi/4}\int_{\sec\theta}^{2\sec\theta}r^{-2}\,dr\,d\theta\)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><path d="M270.00,328.53L430.00,328.53" stroke="#88938e" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/><path d="M298.24,328.53L392.35,328.53L392.35,140.29L298.24,234.41Z" stroke="#236750" stroke-width="2.5" fill="#dfeee5"/><circle cx="298.24" cy="328.53" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="392.35" cy="328.53" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="392.35" cy="140.29" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><circle cx="298.24" cy="234.41" r="5" fill="#b64636" stroke="#b64636" stroke-width="2"/><path d="M326.47,328.53L359.41,328.53" stroke="#b87418" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/></svg>